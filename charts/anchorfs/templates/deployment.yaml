# The AnchorFS service: one replica, Recreate strategy (single writer to the
# metadata database and object bucket), TLS 1.3 listener, restricted contexts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anchorfs
  labels:
    {{- include "anchorfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "anchorfs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
  template:
    metadata:
      labels:
        {{- include "anchorfs.labels" . | nindent 8 }}
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: anchorfs
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      securityContext:
        {{- include "anchorfs.podContext" . | nindent 8 }}
      containers:
        - name: anchorfs-service
          image: {{ include "anchorfs.image" (dict "img" .Values.image.service "path" "image.service") | quote }}
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: https
              containerPort: {{ include "anchorfs.containerPort" . }}
              protocol: TCP
          env:
            - {name: ANCHORFS_DEPLOYMENT_ID, value: {{ include "anchorfs.deploymentId" . | quote }}}
            - {name: ANCHORFS_DURABILITY_PROFILE, value: {{ include "anchorfs.durability" . | quote }}}
            - {name: ANCHORFS_LISTEN_ADDR, value: {{ .Values.listenAddr | quote }}}
            - {name: ANCHORFS_DB_MAX_CONNECTIONS, value: {{ .Values.dbMaxConnections | quote }}}
            - {name: ANCHORFS_TLS_CERT_PATH, value: /etc/anchorfs/tls/tls.crt}
            - {name: ANCHORFS_TLS_KEY_PATH, value: /etc/anchorfs/tls/tls.key}
            - {name: ANCHORFS_S3_ENDPOINT, value: {{ .Values.s3.endpoint | quote }}}
            - {name: ANCHORFS_S3_REGION, value: {{ .Values.s3.region | quote }}}
            - {name: ANCHORFS_S3_BUCKET, value: {{ .Values.s3.bucket | quote }}}
            - {name: ANCHORFS_S3_ADDRESSING, value: {{ .Values.s3.addressing | quote }}}
            - {name: ANCHORFS_S3_CHECKSUM_MODE, value: {{ .Values.s3.checksumMode | quote }}}
            - {name: ANCHORFS_S3_CREDENTIAL_SOURCE, value: static}
            {{- if .Values.s3.caBundleFromSecret }}
            - {name: ANCHORFS_S3_CA_BUNDLE_PATH, value: /etc/anchorfs/ca/tls.crt}
            {{- end }}
            {{- range $k := list "ANCHORFS_DATABASE_URL" "ANCHORFS_CURSOR_SIGNING_KEY" "ANCHORFS_S3_ACCESS_KEY_ID" "ANCHORFS_S3_SECRET_ACCESS_KEY" }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.env | quote }}
                  key: {{ $k }}
            {{- end }}
          securityContext:
            {{- include "anchorfs.restrictedContext" . | nindent 12 }}
          startupProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: https, scheme: HTTPS}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: tls, mountPath: /etc/anchorfs/tls, readOnly: true}
            {{- if .Values.s3.caBundleFromSecret }}
            - {name: ca, mountPath: /etc/anchorfs/ca, readOnly: true}
            {{- end }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.secrets.tls | quote }}
            defaultMode: 288  # decimal for octal 0440 (owner+group read; group is fsGroup 10001)
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        {{- if .Values.s3.caBundleFromSecret }}
        - name: ca
          secret:
            secretName: {{ .Values.secrets.ca | quote }}
            defaultMode: 288  # decimal for octal 0440 (owner+group read; group is fsGroup 10001)
            items:
              - {key: tls.crt, path: tls.crt}
        {{- end }}
