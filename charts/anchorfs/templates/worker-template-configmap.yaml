{{- if .Values.workerTemplate.enabled }}
{{- $mountImage := include "anchorfs.image" (dict "img" .Values.image.mount "path" "image.mount") -}}
# Canonical worker Pod manifest (spec 04 "dedicated trusted FUSE client in the
# workload pod"). The chart never creates a pod from it; the cluster proof or an
# operator substitutes the literal __PLACEHOLDERS__ below and applies it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anchorfs-worker-template
  labels:
    {{- include "anchorfs.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-template
data:
  pod.yaml: |
    # Placeholders (plain string substitution of scalars before apply):
    #   __NAME__ __NODE__ __WORKSPACE__ __SESSION_ID__ __SESSION_EPOCH__
    #   __CREDENTIAL_SECRET__  Secret holding key "bearer" (the worker's credential)
    #
    # A pod bound to a workflow lease is the same manifest plus three edits made on the
    # parsed object (not by text splicing): append "--workflow-epoch", "<epoch>",
    # "--workflow-token-file", "/etc/anchorfs/workflow/token" to the mount container args,
    # add a Secret volume "workflow" (key "token", defaultMode 288) and mount it read-only
    # at /etc/anchorfs/workflow in the mount container.
    #
    # Invariants:
    #  * The mountpoint is the root of a memory-backed emptyDir: mode 0777, not
    #    sticky, writable by uid 10001, as the FUSE 3.14 non-root permission
    #    check requires.
    #  * The sidecar needs a privileged container to publish a bidirectional
    #    mount, and it must NOT enable no-new-privileges: fuser falls back to the
    #    setuid fusermount3 helper when opening /dev/fuse directly is refused
    #    for uid 10001, and that helper needs setuid to work. The image rootfs
    #    is not mounted nosuid.
    #  * Kubernetes requires a container to destroy bidirectional mounts it
    #    created: on SIGTERM the sidecar runs a non-lazy "fusermount3 -u".
    #  * The worker container's propagated copy of the mount counts as a
    #    reference. A worker process holding an fd or cwd under the workspace
    #    makes the unmount fail ("unmount refused") and leaves a dead mount on
    #    the node until SIGKILL. Stop worker-side processes and check
    #    /proc/*/cwd and /proc/*/fd before deleting the pod.
    #  * Secret volumes are group-readable (mode 288 decimal = 0440) and the pod
    #    sets the volume group to 10001, so uid 10001 can read them without
    #    capabilities.
    apiVersion: v1
    kind: Pod
    metadata:
      name: __NAME__
      labels:
        app.kubernetes.io/name: anchorfs
        anchorfs.proof/role: worker
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: __NODE__
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: workspace
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: fuse
          hostPath:
            path: {{ .Values.workerTemplate.fuseDevice | quote }}
            type: CharDevice
        - name: credential
          secret:
            secretName: __CREDENTIAL_SECRET__
            defaultMode: 288
        - name: ca
          secret:
            secretName: {{ .Values.secrets.tls | quote }}
            defaultMode: 288
            items:
              - {key: ca.crt, path: ca.crt}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: mount
          image: {{ $mountImage | quote }}
          args: ["mount", {{ .Values.workerTemplate.workspacePath | quote }}, "--endpoint", "https://anchorfs:{{ .Values.service.port }}", "--workspace", "__WORKSPACE__", "--session-id", "__SESSION_ID__", "--session-epoch", "__SESSION_EPOCH__", "--credential-file", "/etc/anchorfs/credential/bearer", "--ca-bundle", "/etc/anchorfs/ca/ca.crt", "--log-format", "json"]
          securityContext:
            privileged: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workerTemplate.workspacePath | quote }}
              mountPropagation: Bidirectional
            - {name: fuse, mountPath: {{ .Values.workerTemplate.fuseDevice | quote }}}
            - {name: credential, mountPath: /etc/anchorfs/credential, readOnly: true}
            - {name: ca, mountPath: /etc/anchorfs/ca, readOnly: true}
        - name: worker
          image: {{ $mountImage | quote }}
          # A bare sleep as PID 1 ignores SIGTERM and would burn the whole grace
          # period on every deletion, so the shell traps TERM.
          command: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 1; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: workspace
              mountPath: {{ .Values.workerTemplate.workspacePath | quote }}
              mountPropagation: HostToContainer
            - {name: tmp, mountPath: /tmp}
{{- end }}
