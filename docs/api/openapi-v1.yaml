      - generation
      - kind
      - size
      - mode
      - uid
      - gid
      - nlink
      - atime
      - mtime
      - ctime
      properties:
        inode_id:
          type: integer
          format: int64
        generation:
          type: integer
          format: int64
        kind:
          $ref: '#/components/schemas/InodeKindDto'
        size:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: integer
          format: int32
          minimum: 0
        uid:
          type: integer
          format: int32
          minimum: 0
        gid:
          type: integer
          format: int32
          minimum: 0
        nlink:
          type: integer
          format: int32
          minimum: 0
        atime:
          type: string
        mtime:
          type: string
        ctime:
          type: string
    InodeKindDto:
      type: string
      enum:
      - file
      - directory
      - symlink
    IssuedCredential:
      type: object
      description: Secret is returned only on issue/rotation; never on inspection or in logs.
      required:
      - operation_id
      - credential_id
      - credential_epoch
      properties:
        operation_id:
          type: string
          format: uuid
        credential_id:
          type: string
          format: uuid
        secret:
          type:
          - string
          - 'null'
          description: Present on the initial response; receipt replays return null.
        credential_epoch:
          type: integer
          format: int64
        expires_at:
          type:
          - string
          - 'null'
    MutationResult:
      type: object
      required:
      - operation_id
      properties:
        operation_id:
          type: string
          format: uuid
        inode_id:
          type:
          - integer
          - 'null'
          format: int64
        generation:
          type:
          - integer
          - 'null'
          format: int64
    OpenHandle:
      type: object
      required:
      - path
      - read
      - write
      - create
      - exclusive
      - truncate
      properties:
        path:
          type: string
        read:
          type: boolean
        write:
          type: boolean
        create:
          type: boolean
        exclusive:
          type: boolean
        truncate:
          type: boolean
        mode:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    OperationStateDto:
      type: string
      enum:
      - pending
      - committed
      - failed
      - indeterminate
    OperationStatus:
      type: object
      required:
      - operation_id
      - state
      properties:
        operation_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/OperationStateDto'
        result: {}
    PathBody:
      type: object
      required:
      - path
      properties:
        path:
          type: string
    ReadPinGrant:
      type: object
      required:
      - operation_id
      - read_pin_id
      - manifest_id
      - generation
      - size
      - expires_at
      properties:
        operation_id:
          type: string
          format: uuid
        read_pin_id:
          type: string
          format: uuid
        manifest_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
          minimum: 0
        expires_at:
          type: string
    RebindSession:
      type: object
      properties:
        workflow_lease_token:
          type:
          - string
          - 'null'
    Rename:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
        to:
          type: string
    SessionGrant:
      type: object
      required:
      - operation_id
      - session_id
      - session_epoch
      - credential_epoch
      - expires_at
      properties:
        operation_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        session_epoch:
          type: integer
          format: int64
        credential_epoch:
          type: integer
          format: int64
        bound_mutation_epoch:
          type:
          - integer
          - 'null'
          format: int64
        expires_at:
          type: string
    SetAttributes:
      type: object
      properties:
        path:
          type:
          - string
          - 'null'
          description: Omit to select the workspace root.
        mode:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        uid:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        gid:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    SymlinkContents:
      type: object
      required:
      - target
      - generation
      properties:
        target:
          type: string
        generation:
          type: integer
          format: int64
    Truncate:
      type: object
      required:
      - size
      properties:
        size:
          type: integer
          format: int64
          minimum: 0
    WorkflowGrant:
      type: object
      required:
      - operation_id
      - mutation_epoch
      - expires_at
      properties:
        operation_id:
          type: string
          format: uuid
        token:
          type:
          - string
          - 'null'
          description: |-
            Present only on initial acquire/takeover; renewals and receipt replays return null.
            A replayed grant is not a usable token.
        mutation_epoch:
          type: integer
          format: int64
        expires_at:
          type: string
    WorkflowStatus:
      type: object
      required:
      - owner_credential_id
      - mutation_epoch
      - expires_at
      - active
      properties:
        owner_credential_id:
          type: string
          format: uuid
        mutation_epoch:
          type: integer
          format: int64
        expires_at:
          type: string
        active:
          type: boolean
    WorkspaceInfo:
      type: object
      required:
      - workspace_id
      - root
      - authorization_epoch
      - mutation_epoch
      properties:
        workflow:
          oneOf:
          - $ref: '#/components/schemas/WorkflowStatus'
          - type: 'null'
        workspace_id:
          type: string
          format: uuid
        root:
          $ref: '#/components/schemas/InodeAttributes'
        authorization_epoch:
          type: integer
          format: int64
        mutation_epoch:
          type: integer
          format: int64
    WriteResult:
      type: object
      required:
      - operation_id
      - generation
      - bytes_written
      - offset
      properties:
        operation_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
        bytes_written:
          type: integer
          format: int64
          minimum: 0
        offset:
          type: integer
          format: int64
          minimum: 0
  securitySchemes:
    credential:
      type: http
      scheme: bearer
      description: administrator-issued opaque credential scoped to workspace and role
