components:
  schemas:
    CreateCredential:
      type: object
      required:
      - kind
      - role
      - uid
      - gid
      - max_reservation_bytes
      properties:
        workspace_id:
          type:
          - string
          - 'null'
          format: uuid
        kind:
          $ref: '#/components/schemas/CredentialKind'
        role:
          $ref: '#/components/schemas/CredentialRole'
        uid:
          type: integer
          format: int32
          minimum: 0
        gid:
          type: integer
          format: int32
          minimum: 0
        expires_at:
          type:
          - string
          - 'null'
        max_reservation_bytes:
          type: integer
          format: int64
          minimum: 0
    CreateDirectory:
      type: object
      required:
      - path
      - mode
      properties:
        path:
          type: string
        mode:
          type: integer
          format: int32
          minimum: 0
    CreateLink:
      type: object
      required:
      - existing_path
      - new_path
      properties:
        existing_path:
          type: string
        new_path:
          type: string
    CreateSession:
      type: object
      required:
      - credential_id
      properties:
        credential_id:
          type: string
          format: uuid
        bind_to_workflow_lease:
          type:
          - string
          - 'null'
    CreateSymlink:
      type: object
      required:
      - path
      - target
      properties:
        path:
          type: string
        target:
          type: string
    CreateWorkspace:
      type: object
      required:
      - logical_bytes_limit
      - logical_inodes_limit
      - physical_bytes_limit
      - staging_bytes_limit
      properties:
        logical_bytes_limit:
          type: integer
          format: int64
          minimum: 0
        logical_inodes_limit:
          type: integer
          format: int64
          minimum: 0
        physical_bytes_limit:
          type: integer
          format: int64
          minimum: 0
        staging_bytes_limit:
          type: integer
          format: int64
          minimum: 0
    CredentialKind:
      type: string
      enum:
      - administrator
      - host
      - worker
    CredentialRole:
      type: string
      enum:
      - read
      - write
      - admin
    DirectoryEntry:
      type: object
      required:
      - name
      - attributes
      properties:
        name:
          type: string
        attributes:
          $ref: '#/components/schemas/InodeAttributes'
    DirectoryPage:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        next_cursor:
          type:
          - string
          - 'null'
    ErrorBody:
      type: object
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCodeDto'
        message:
          type: string
        trace_id:
          type: string
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        retry_after_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ErrorCodeDto:
      type: string
      enum:
      - invalid_input
      - name_too_long
      - unauthenticated
      - forbidden
      - not_found
      - method_not_allowed
      - exists
      - generation_conflict
      - idempotency_mismatch
      - workspace_busy
      - fenced
      - operation_indeterminate
      - not_directory
      - is_directory
      - directory_not_empty
      - stale_handle
      - payload_too_large
      - file_too_large
      - unsupported_media_type
      - rate_limited
      - quota_exceeded
      - capacity_exhausted
      - unsupported
      - not_implemented
      - dependency_unavailable
      - outcome_unknown
      - unsafe_database_settings
      - schema_version_mismatch
    InodeAttributes:
      type: object
      required:
      - inode_id
      - generation
      - kind
      - size
      - mode
      - uid
      - gid
      - nlink
      - atime
      - mtime
      - ctime
      properties:
        inode_id:
          type: integer
          format: int64
        generation:
          type: integer
          format: int64
        kind:
          type: string
        size:
          type: integer
          format: int64
          minimum: 0
        mode:
          type: integer
          format: int32
          minimum: 0
        uid:
          type: integer
          format: int32
          minimum: 0
        gid:
          type: integer
          format: int32
          minimum: 0
        nlink:
          type: integer
          format: int32
          minimum: 0
        atime:
          type: string
        mtime:
          type: string
        ctime:
          type: string
    OpenHandle:
      type: object
      required:
      - path
      - read
      - write
      - create
      - exclusive
      - truncate
      - mode
      properties:
        path:
          type: string
        read:
          type: boolean
        write:
          type: boolean
        create:
          type: boolean
        exclusive:
          type: boolean
        truncate:
          type: boolean
        mode:
          type: integer
          format: int32
          minimum: 0
    OperationStatus:
      type: object
      required:
      - operation_id
      - state
      properties:
        operation_id:
          type: string
          format: uuid
        state:
          type: string
        result: {}
    PathBody:
      type: object
      required:
      - path
      properties:
        path:
          type: string
    RebindSession:
      type: object
      properties:
        workflow_lease_token:
          type:
          - string
          - 'null'
    Rename:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
        to:
          type: string
    SetAttributes:
      type: object
      required:
      - path
      properties:
        path:
          type: string
        mode:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        uid:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        gid:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
    Truncate:
      type: object
      required:
      - size
      properties:
        size:
          type: integer
          format: int64
          minimum: 0
  securitySchemes:
    credential:
      type: http
      scheme: bearer
      description: administrator-issued opaque credential scoped to workspace and role
