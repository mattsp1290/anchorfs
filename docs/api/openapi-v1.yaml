      type: object
      required:
      - path
      - mode
      properties:
        path:
          type: string
        mode:
          type: integer
          format: int32
          minimum: 0
    CreateLink:
      type: object
      required:
      - existing_path
      - new_path
      properties:
        existing_path:
          type: string
        new_path:
          type: string
    CreateSession:
      type: object
      required:
      - credential_id
      properties:
        credential_id:
          type: string
          format: uuid
        bind_to_workflow_lease:
          type:
          - string
          - 'null'
    CreateSymlink:
      type: object
      required:
      - path
      - target
      properties:
        path:
          type: string
        target:
          type: string
    CreateWorkspace:
      type: object
      required:
      - root_uid
      - root_gid
      - logical_bytes_limit
      - logical_inodes_limit
      - physical_bytes_limit
      - staging_bytes_limit
      properties:
        root_uid:
          type: integer
          format: int32
          minimum: 0
        root_gid:
          type: integer
          format: int32
          minimum: 0
        root_mode:
          type:
          - integer
          - 'null'
          format: int32
          minimum: 0
        logical_bytes_limit:
          type: integer
          format: int64
          minimum: 0
        logical_inodes_limit:
          type: integer
          format: int64
          minimum: 0
        physical_bytes_limit:
          type: integer
          format: int64
          minimum: 0
        staging_bytes_limit:
          type: integer
          format: int64
          minimum: 0
    CreatedWorkspace:
      type: object
      required:
      - operation_id
      - workspace
      properties:
        operation_id:
          type: string
          format: uuid
        workspace:
          $ref: '#/components/schemas/WorkspaceInfo'
    CredentialKind:
      type: string
      enum:
      - administrator
      - host
      - worker
    CredentialRole:
      type: string
      enum:
      - read
      - write
      - admin
    DirectoryEntry:
      type: object
      required:
      - name
      - attributes
      properties:
        name:
          type: string
        attributes:
          $ref: '#/components/schemas/InodeAttributes'
    DirectoryPage:
      type: object
      required:
      - namespace_generation
      - entries
      properties:
        namespace_generation:
          type: integer
          format: int64
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryEntry'
        next_cursor:
          type:
          - string
          - 'null'
    ErrorBody:
      type: object
      required:
      - code
      - message
      - trace_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCodeDto'
        message:
          type: string
        trace_id:
          type: string
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        retry_after_ms:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
    ErrorCodeDto:
      type: string
      enum:
      - invalid_input
      - name_too_long
      - unauthenticated
      - forbidden
      - not_found
      - method_not_allowed
      - exists
      - generation_conflict
      - idempotency_mismatch
      - workspace_busy
      - fenced
      - operation_indeterminate
      - operation_failed
      - not_directory
      - is_directory
      - directory_not_empty
      - stale_handle
      - payload_too_large
      - file_too_large
      - unsupported_media_type
      - rate_limited
      - quota_exceeded
      - capacity_exhausted
      - unsupported
      - not_implemented
      - dependency_unavailable
      - outcome_unknown
      - unsafe_database_settings
      - schema_version_mismatch
    HandleGrant:
      type: object
      required:
      - operation_id
      - handle_id
      - attributes
      - access_read
      - access_write
      - expires_at
      properties:
        operation_id:
          type: string
          format: uuid
        handle_id:
          type: string
          format: uuid
        attributes:
          $ref: '#/components/schemas/InodeAttributes'
        access_read:
          type: boolean
        access_write:
          type: boolean
        expires_at:
          type: string
    InodeAttributes:
      type: object
      required:
