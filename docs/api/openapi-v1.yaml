        uid:
          type: integer
          format: int32
          minimum: 0
        gid:
          type: integer
          format: int32
          minimum: 0
        expires_at:
          type:
          - string
          - 'null'
        max_reservation_bytes:
          type: integer
          format: int64
          minimum: 0
