name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-deny-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check licenses bans advisories sources
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git
      - run: ls -l /dev/fuse && fusermount3 --version && id -u && uname -r
      - run: cargo test --workspace --locked -- --test-threads=4
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-linux-arm64-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo build --workspace --locked
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-macos-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --no-run --locked
      - run: cargo test -p anchorfs-core -p anchorfs-backend -p anchorfs-mount --locked
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: python3 --version
      - name: Exporter unit tests
        run: python3 -I -m unittest discover -s scripts/tests -v
      - name: Install pinned Helm 3.13.0 (checksum verified)
        run: echo "HELM_COMPAT=$(bash ci/install-helm.sh "$RUNNER_TEMP/helm-3.13.0")" >> "$GITHUB_ENV"
      - name: Chart lint and render checks (Helm 3.13.0)
        run: |
          zero=$(printf '0%.0s' $(seq 64))
          "$HELM_COMPAT" lint charts/anchorfs \
            --set image.service.repository=x --set "image.service.digest=sha256:$zero" \
            --set image.mount.repository=x --set "image.mount.digest=sha256:$zero"
          PATH="$(dirname "$HELM_COMPAT"):$PATH" CHART_STRICT=0 bash scripts/check-chart.sh
      - name: Shell script syntax
        run: for f in scripts/*.sh scripts/cluster/*.sh ci/*.sh; do bash -n "$f"; done
  image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker version
      - run: docker build -f docker/Dockerfile --target service -t anchorfs-service:ci .
      - run: docker build -f docker/Dockerfile --target mount -t anchorfs-mount:ci .
      - name: Packaging smoke
        run: bash ci/image-smoke.sh amd64
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker version
      - run: docker build -f docker/Dockerfile --target service -t anchorfs-service:ci .
      - run: docker build -f docker/Dockerfile --target mount -t anchorfs-mount:ci .
      - name: Packaging smoke
        run: bash ci/image-smoke.sh arm64
