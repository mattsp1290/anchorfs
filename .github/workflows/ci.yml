name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-deny-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny check licenses bans advisories sources
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-test-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y fuse3 git
      - run: ls -l /dev/fuse && fusermount3 --version && id -u && uname -r
      - run: cargo test --workspace --locked -- --test-threads=4
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-linux-arm64-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo build --workspace --locked
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-build-macos-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --no-run --locked
      - run: cargo test -p anchorfs-core -p anchorfs-backend -p anchorfs-mount --locked
  image-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker version
      - run: docker build -f docker/Dockerfile --target service -t anchorfs-service:ci .
      - run: docker build -f docker/Dockerfile --target mount -t anchorfs-mount:ci .
      - name: Packaging smoke
        run: |
          set -euo pipefail
          # 1 shipped contract equals the committed snapshot (trailing whitespace normalized; the Rust snapshot test uses trim_end)
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          docker run --rm anchorfs-service:ci openapi --format yaml > "$tmp/openapi.yaml"
          diff -u <(sed -e 's/[[:space:]]*$//' docs/api/openapi-v1.yaml) <(sed -e 's/[[:space:]]*$//' "$tmp/openapi.yaml")
          # 2,3 non-root
          test "$(docker run --rm --entrypoint id anchorfs-service:ci -u)" = 10001
          test "$(docker run --rm --entrypoint id anchorfs-mount:ci -u)" = 10001
          # 4 bare serve fails closed on configuration (exit 2, names the missing variable)
          rc=0; err=$(docker run --rm anchorfs-service:ci serve 2>&1 >/dev/null) || rc=$?
          test "$rc" -eq 2; grep -q 'ANCHORFS_DATABASE_URL' <<<"$err"
          # 5 a lone TLS variable is rejected before the database URL is required (exit 2, names the rule)
          rc=0; err=$(docker run --rm -e ANCHORFS_TLS_CERT_PATH=/nonexistent anchorfs-service:ci serve 2>&1 >/dev/null) || rc=$?
          test "$rc" -eq 2; grep -q 'set together' <<<"$err"
          # 6 mount binary runs and prints the strict profile
          out=$(docker run --rm anchorfs-mount:ci --print-profile); grep -q direct_io <<<"$out"
          # 7 mount helper present
          docker run --rm --entrypoint fusermount3 anchorfs-mount:ci --version
          # 8 CA store present in the service image
          docker run --rm --entrypoint sh anchorfs-service:ci -c 'test -r /etc/ssl/certs/ca-certificates.crt'
          # 9 architecture recorded in the job log
          docker image inspect anchorfs-service:ci --format '{{.Architecture}}'
  image-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker version
      - run: docker build -f docker/Dockerfile --target service -t anchorfs-service:ci .
      - run: docker build -f docker/Dockerfile --target mount -t anchorfs-mount:ci .
      - name: Packaging smoke
        run: |
          set -euo pipefail
          # 1 shipped contract equals the committed snapshot (trailing whitespace normalized; the Rust snapshot test uses trim_end)
          tmp="${RUNNER_TEMP:-$(mktemp -d)}"
          docker run --rm anchorfs-service:ci openapi --format yaml > "$tmp/openapi.yaml"
          diff -u <(sed -e 's/[[:space:]]*$//' docs/api/openapi-v1.yaml) <(sed -e 's/[[:space:]]*$//' "$tmp/openapi.yaml")
          # 2,3 non-root
          test "$(docker run --rm --entrypoint id anchorfs-service:ci -u)" = 10001
          test "$(docker run --rm --entrypoint id anchorfs-mount:ci -u)" = 10001
          # 4 bare serve fails closed on configuration (exit 2, names the missing variable)
          rc=0; err=$(docker run --rm anchorfs-service:ci serve 2>&1 >/dev/null) || rc=$?
          test "$rc" -eq 2; grep -q 'ANCHORFS_DATABASE_URL' <<<"$err"
          # 5 a lone TLS variable is rejected before the database URL is required (exit 2, names the rule)
          rc=0; err=$(docker run --rm -e ANCHORFS_TLS_CERT_PATH=/nonexistent anchorfs-service:ci serve 2>&1 >/dev/null) || rc=$?
          test "$rc" -eq 2; grep -q 'set together' <<<"$err"
          # 6 mount binary runs and prints the strict profile
          out=$(docker run --rm anchorfs-mount:ci --print-profile); grep -q direct_io <<<"$out"
          # 7 mount helper present
          docker run --rm --entrypoint fusermount3 anchorfs-mount:ci --version
          # 8 CA store present in the service image
          docker run --rm --entrypoint sh anchorfs-service:ci -c 'test -r /etc/ssl/certs/ca-certificates.crt'
          # 9 architecture recorded in the job log
          docker image inspect anchorfs-service:ci --format '{{.Architecture}}'
